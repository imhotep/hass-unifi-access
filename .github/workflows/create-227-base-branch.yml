name: Create 227 base branch

on:
  push:
    branches: [fix/double-driveway-review-nits]
    paths:
      - .github/workflows/create-227-base-branch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create feature/double-driveway-mode at PR 227 head
        run: |
          set -euo pipefail
          git fetch origin pull/227/head:feature/double-driveway-mode
          git push origin feature/double-driveway-mode
