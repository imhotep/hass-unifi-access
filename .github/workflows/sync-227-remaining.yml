name: Sync remaining 227 files

on:
  workflow_dispatch:
  push:
    branches: [fix/double-driveway-review-nits]
    paths:
      - .github/workflows/sync-227-remaining.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/double-driveway-review-nits
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run sync script
        run: |
          echo '' | base64 -d > /tmp/sync227.sh
          chmod +x /tmp/sync227.sh
          bash /tmp/sync227.sh
